<text x="67.64" y="158.19" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="16.67" fill="#000000"><tspan fill="#000000" font-size="16.67">固收方面，组合以直接投资与配置国泰内部的国泰固收型和混合型养老金作为主要投资方式。产品期末主要持有国泰金色年华混合型养老金产品、国泰金色年</tspan><tspan x="67.64" dy="25" fill="#000000" font-size="16.67">华固定收益型养老金产品、国泰金色年华信托型养老金产品2期、国泰金色年华信托型养老金产品1期，占比合计14.77%，较期初占比下降1.96%，持仓产品</tspan><tspan x="67.64" dy="25" fill="#000000" font-size="16.67">今年同期收益率分别为3.53%、1.38%、1.09%、.98%，全市场排名11/135、85/545、256/545、378/545，年化收益率分别为12.99%、5.63%、4.48%、</tspan><tspan x="67.64" dy="25" fill="#000000" font-size="16.67">4.06%。直接持仓主要包括中期票据、公司债、私募债。主要增持私募债券，减持PPN；产品配置方面，无养老金增持，减持国泰金色年华固定收益型养老金</tspan><tspan x="67.64" dy="25" fill="#000000" font-size="16.67">产品。</tspan></text>
</g>

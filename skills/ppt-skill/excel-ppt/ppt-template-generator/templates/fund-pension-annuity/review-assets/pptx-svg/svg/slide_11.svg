<g id="shape-7" data-name="文本占位符 6" data-ph-type="body">
<rect x="65.5" y="114.5" width="687.81" height="265.58" fill="none"/>
<text x="75.1" y="134.03" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, sans-serif" font-size="17.33" fill="#000000" font-weight="bold"><tspan fill="#000000" font-size="17.33" font-weight="bold">投资回顾：</tspan></text>
<text x="75.1" y="160.03" text-anchor="start" xml:space="preserve" font-family="sans-serif" font-size="17.33" fill="#000000"><tspan fill="#000000" font-size="17.33">可转债方面，截至2023年3月31日，组合直接持仓可转债仓位2.73%，穿透养老金产品</tspan><tspan x="75.1" dy="26" fill="#000000" font-size="17.33">后可转债仓位3.15%。</tspan></text>
<text x="75.1" y="212.03" text-anchor="start" xml:space="preserve" font-family="sans-serif" font-size="17.33" fill="#000000"><tspan fill="#000000" font-size="17.33">组合穿透后，持仓转债大盘占比2.28%，中盘占比0.57%，小盘占比0.01%。</tspan></text>
<text x="75.1" y="238.03" text-anchor="start" xml:space="preserve" font-family="sans-serif" font-size="17.33" fill="#000000"><tspan fill="#000000" font-size="17.33">组合穿透后主要持有以下行业的可转债：金融、工业、日常消费品、公用事业、信息技</tspan><tspan x="75.1" dy="26" fill="#000000" font-size="17.33">术，增持金融、可选消费、信息技术，减持工业、日常消费品、公用事业，正贡献主要</tspan><tspan x="75.1" dy="26" fill="#000000" font-size="17.33">来自于日常消费品、工业、信息技术，负贡献主要来自于金融、医疗保健。</tspan></text>
</g>

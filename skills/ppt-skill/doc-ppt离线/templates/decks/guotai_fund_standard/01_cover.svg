<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>
  <g id="logo-area">
    <image href="brand_logo_header.png" x="72" y="42" width="126" height="35" preserveAspectRatio="xMidYMid meet"/>
    <rect x="72" y="82" width="380" height="4" fill="#9E0116"/>
  </g>
  <g id="cover-title">
    <rect x="82" y="142" width="7" height="142" fill="#C9C9CA"/>
    <text x="112" y="195" font-family="Arial, Microsoft YaHei, sans-serif" font-size="52" font-weight="bold" fill="#9E0116">{{TITLE}}</text>
    <text x="112" y="250" font-family="Arial, Microsoft YaHei, sans-serif" font-size="28" font-weight="bold" fill="#9E0116">{{SUBTITLE}}</text>
  </g>
  <g id="cover-meta">
    <text x="112" y="315" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" fill="#262626">{{AUTHOR}}</text>
    <text x="112" y="347" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#706F71">{{DATE}}</text>
  </g>
  <g id="cover-skyline">
    <image href="skyline_cover.png" x="0" y="390" width="1280" height="280" preserveAspectRatio="xMidYMax meet"/>
    <rect x="0" y="663" width="1280" height="6" fill="#BF9D5A"/>
  </g>
</svg>

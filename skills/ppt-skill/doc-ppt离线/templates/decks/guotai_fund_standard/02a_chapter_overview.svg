<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
    <rect x="0" y="0" width="330" height="720" fill="#F2F2F2"/>
  </g>
  <g id="chapter-header">
    <rect x="72" y="50" width="400" height="4" fill="#9E0116"/>
    <image href="brand_logo_header.png" x="1080" y="42" width="126" height="35" preserveAspectRatio="xMidYMid meet"/>
    <rect x="70" y="200" width="230" height="92" fill="#9E0116"/>
    <text x="185" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">{{CHAPTER_NUM}}</text>
  </g>
  <g id="chapter-overview">
    <text x="372" y="222" font-family="Arial, Microsoft YaHei, sans-serif" font-size="34" font-weight="bold" fill="#262626">{{CHAPTER_TITLE}}</text>
    <line x1="372" y1="250" x2="1040" y2="250" stroke="#D9D9D9" stroke-width="2"/>
    <text x="392" y="310" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" fill="#262626">
      <tspan x="392" dy="0">一　{{TOC_ITEM_1_TITLE}}</tspan>
      <tspan x="392" dy="54">二　{{TOC_ITEM_2_TITLE}}</tspan>
      <tspan x="392" dy="54">三　{{TOC_ITEM_3_TITLE}}</tspan>
    </text>
  </g>
  <g id="chapter-skyline">
    <image href="skyline_cover.png" x="0" y="430" width="1280" height="230" preserveAspectRatio="xMidYMax meet"/>
    <rect x="0" y="655" width="1280" height="6" fill="#BF9D5A"/>
  </g>
</svg>

  <g id="insight-3"><rect x="792" y="470" width="416" height="112" fill="#F2F2F2"/><rect x="792" y="470" width="74" height="112" fill="#BF9D5A"/><text x="829" y="536" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">03</text><text x="894" y="510" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#262626">{{ITEM_3_TITLE}}</text><text x="894" y="546" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" fill="#706F71">{{ITEM_3_BODY}}</text></g>
  <g id="footer"><image href="brand_logo_footer.png" x="72" y="665" width="75" height="21" preserveAspectRatio="xMidYMid meet"/><text x="1208" y="681" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#9E0116">{{PAGE_NUM}}</text></g>

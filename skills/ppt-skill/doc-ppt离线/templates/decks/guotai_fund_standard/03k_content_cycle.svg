<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <g id="background"><rect width="1280" height="720" fill="#FFFFFF"/></g>
  <g id="header"><rect x="72" y="48" width="400" height="4" fill="#9E0116"/><rect x="72" y="72" width="1136" height="30" fill="#F2F2F2"/><text x="86" y="94" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#9E0116">{{PAGE_TITLE}}</text><text x="72" y="144" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#706F71">{{KEY_MESSAGE}}</text></g>
  <g id="cycle-track"><rect x="116" y="280" width="1048" height="96" rx="48" fill="#F2F2F2"/></g>
  <g id="cycle-1"><circle cx="200" cy="328" r="70" fill="#FFFFFF" stroke="#9E0116" stroke-width="10"/><text x="200" y="336" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="bold" fill="#262626">{{ITEM_1_TITLE}}</text></g>
  <g id="cycle-2"><circle cx="420" cy="328" r="70" fill="#FFFFFF" stroke="#5D070C" stroke-width="10"/><text x="420" y="336" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="bold" fill="#262626">{{ITEM_2_TITLE}}</text></g>
  <g id="cycle-3"><circle cx="640" cy="328" r="70" fill="#FFFFFF" stroke="#706F71" stroke-width="10"/><text x="640" y="336" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="bold" fill="#262626">{{CONTENT_AREA}}</text></g>
  <g id="cycle-4"><circle cx="860" cy="328" r="70" fill="#FFFFFF" stroke="#A7A7A7" stroke-width="10"/><text x="860" y="336" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="bold" fill="#262626">{{ITEM_4_TITLE}}</text></g>
  <g id="cycle-5"><circle cx="1080" cy="328" r="70" fill="#FFFFFF" stroke="#BF9D5A" stroke-width="10"/><text x="1080" y="336" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="bold" fill="#262626">{{ITEM_5_TITLE}}</text></g>
  <g id="cycle-notes"><text x="200" y="450" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" fill="#706F71">{{ITEM_1_BODY}}</text><text x="420" y="450" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" fill="#706F71">{{ITEM_2_BODY}}</text><text x="640" y="450" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" fill="#706F71">{{ITEM_3_BODY}}</text><text x="860" y="450" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" fill="#706F71">{{ITEM_4_BODY}}</text><text x="1080" y="450" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" fill="#706F71">{{ITEM_5_BODY}}</text></g>
  <g id="footer"><image href="brand_logo_footer.png" x="72" y="665" width="75" height="21" preserveAspectRatio="xMidYMid meet"/><text x="1208" y="681" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#9E0116">{{PAGE_NUM}}</text></g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <g id="background"><rect width="1280" height="720" fill="#FFFFFF"/></g>
  <g id="header">
    <rect x="72" y="48" width="400" height="4" fill="#9E0116"/><rect x="72" y="72" width="1136" height="30" fill="#F2F2F2"/>
    <text x="86" y="94" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#9E0116">{{PAGE_TITLE}}</text>
    <text x="72" y="144" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#706F71">{{KEY_MESSAGE}}</text>
  </g>
  <g id="column-1">
    <rect x="72" y="188" width="352" height="390" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/>
    <rect x="72" y="188" width="352" height="54" fill="#9E0116"/>
    <text x="248" y="222" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">{{ITEM_1_TITLE}}</text>
    <text x="98" y="292" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#262626">{{ITEM_1_BODY}}</text>
  </g>
  <g id="column-2">
    <rect x="464" y="188" width="352" height="390" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/>
    <rect x="464" y="188" width="352" height="54" fill="#5D070C"/>
    <text x="640" y="222" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">{{ITEM_2_TITLE}}</text>
    <text x="490" y="292" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#262626">{{CONTENT_AREA}}</text>
  </g>
  <g id="column-3">
    <rect x="856" y="188" width="352" height="390" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/>
    <rect x="856" y="188" width="352" height="54" fill="#706F71"/>
    <text x="1032" y="222" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">{{ITEM_3_TITLE}}</text>
    <text x="882" y="292" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#262626">{{ITEM_3_BODY}}</text>
  </g>
  <g id="footer"><image href="brand_logo_footer.png" x="72" y="665" width="75" height="21" preserveAspectRatio="xMidYMid meet"/><text x="1208" y="681" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#9E0116">{{PAGE_NUM}}</text></g>
</svg>

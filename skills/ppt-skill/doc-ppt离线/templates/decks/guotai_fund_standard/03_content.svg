<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/></g>
  <g id="header">
    <rect x="72" y="48" width="400" height="4" fill="#9E0116"/>
    <rect x="72" y="72" width="1136" height="30" fill="#F2F2F2"/>
    <text x="86" y="94" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold" fill="#9E0116">{{PAGE_TITLE}}</text>
  </g>
  <g id="key-message">
    <text x="72" y="146" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#706F71">{{KEY_MESSAGE}}</text>
  </g>
  <g id="content-area">
    <rect x="72" y="176" width="1136" height="438" rx="6" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="640" y="405" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" fill="#A7A7A7">{{CONTENT_AREA}}</text>
  </g>
  <g id="footer">
    <image href="brand_logo_footer.png" x="72" y="665" width="75" height="21" preserveAspectRatio="xMidYMid meet"/>
    <text x="1080" y="681" text-anchor="end" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" fill="#706F71">{{SOURCE}}</text>
    <text x="1208" y="681" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#9E0116">{{PAGE_NUM}}</text>
  </g>
</svg>
